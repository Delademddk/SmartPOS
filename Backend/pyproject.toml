[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartpos-backend"
version = "1.0.0"
description = "SmartPOS - Enterprise Point of Sale and Inventory Management System backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "SQLAlchemy==2.0.36",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "PyJWT==2.10.1",
    "bcrypt==4.2.1",
    "python-dotenv==1.0.1",
    "pyodbc==5.2.0",
    "pymssql==2.3.2",
    "alembic==1.14.0",
    "structlog==24.4.0",
    "slowapi==0.1.9",
    "python-multipart==0.0.20",
    "Pillow==11.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q"
pythonpath = ["."]
